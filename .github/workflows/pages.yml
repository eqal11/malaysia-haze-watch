name: Deploy static Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - name: Prepare static website
        run: |
          mkdir _site
          cp *.html LICENSE *.md _site/
          cp -r css js data assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4

